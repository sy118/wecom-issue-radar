name: Build Windows installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

# 版本号唯一来源：package.json。tag 只是发布触发器，CI 会校验两者一致。
# 构建链：pnpm test/typecheck → Python 测试 → PyInstaller sidecar →
#         Rust 微信填入 helper（native/wechat-input-helper）→
#         pnpm build（Vite 渲染层 + esbuild Electron main/preload）→
#         electron-builder NSIS → 产物校验 → artifact / GitHub Release。
# Rust helper 产物复制为 dist/wechat-input-helper.exe，由 electron-builder 的
# extraResources 放进安装目录 resources/bin/，与 Python sidecar 的 bin/ 目录一致。
# 旧 Tauri 客户端读 releases/latest/download/latest.json；每个 Release 都会
# 重新上传固定指向最后一版 Tauri 安装包的兼容清单，避免旧客户端报错或误装 Electron 包。

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # 兼容清单固定指向最后一版 Tauri 发布；只有用户明确更换维护基线时才修改。
      LEGACY_TAURI_TAG: v3.5.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v([0-9]+)\.([0-9]+)\.([0-9]+)$') {
            throw "Release tag must use canonical vX.Y.Z SemVer: $tag"
          }
          $version = $Matches[0].Substring(1)
          $packageVersion = (Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json).version
          if ($version -ne $packageVersion) {
            throw "Tag $tag does not match package.json version $packageVersion (package.json is the single version source)"
          }
          git fetch origin main:refs/remotes/origin/main --no-tags --quiet
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch origin/main" }
          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $env:GITHUB_SHA is not contained in origin/main"
          }
          Write-Host "Release metadata OK: $tag (package.json $packageVersion)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "pyinstaller==6.21.0"

      - name: Test frontend
        run: pnpm test

      - name: Type-check frontend and Electron sources
        run: pnpm typecheck

      - name: Format Rust helper
        shell: pwsh
        run: |
          # rustfmt is applied in CI because the helper is developed without a
          # local Rust toolchain; formatting differences must not block a build.
          cargo fmt --manifest-path native/wechat-input-helper/Cargo.toml
          if ($LASTEXITCODE -ne 0) {
            throw "cargo fmt failed for native/wechat-input-helper"
          }

      - name: Lint Rust helper
        shell: pwsh
        run: |
          cargo clippy --manifest-path native/wechat-input-helper/Cargo.toml --target x86_64-pc-windows-msvc --all-targets
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed for native/wechat-input-helper" }

      - name: Test Rust helper
        shell: pwsh
        run: |
          cargo test --manifest-path native/wechat-input-helper/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed for native/wechat-input-helper" }

      - name: Test Python pipeline
        run: python -m unittest discover -s tests -v

      - name: Build Python processing sidecar
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm worker\issue_radar_worker.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          $sidecar = Join-Path $env:GITHUB_WORKSPACE "dist\wecom-issue-radar-worker.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Sidecar executable is missing: $sidecar"
          }
          & $sidecar --self-check
          if ($LASTEXITCODE -ne 0) { throw "Sidecar self-check failed" }
          Write-Host "Sidecar ready for extraResources: $sidecar"

      - name: Build Rust WeChat fill helper
        shell: pwsh
        run: |
          cargo build --release --manifest-path native/wechat-input-helper/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed for native/wechat-input-helper" }
          $helper = Join-Path $env:GITHUB_WORKSPACE "native\wechat-input-helper\target\x86_64-pc-windows-msvc\release\wechat-input-helper.exe"
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "Rust helper executable is missing: $helper"
          }
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $distHelper = Join-Path $distDir "wechat-input-helper.exe"
          Copy-Item -LiteralPath $helper -Destination $distHelper -Force
          if (-not (Test-Path -LiteralPath $distHelper -PathType Leaf)) {
            throw "Rust helper was not copied to dist: $distHelper"
          }
          Write-Host "WeChat fill helper ready for extraResources: $distHelper"

      - name: Build renderer and Electron bundles
        run: pnpm build

      - name: Verify build outputs
        shell: pwsh
        run: |
          $required = @(
            "frontend-dist\index.html",
            "dist-electron\main.cjs",
            "dist-electron\preload.cjs",
            "dist\wecom-issue-radar-worker.exe",
            "dist\wechat-input-helper.exe"
          )
          foreach ($relative in $required) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Build output is missing: $relative"
            }
          }
          Write-Host "Renderer, Electron bundles, Python sidecar and Rust helper are present"

      - name: Build NSIS installer
        shell: pwsh
        env:
          # 当前不做 Authenticode 签名；关闭 electron-builder 的证书自动发现，避免
          # 环境里有证书时产生不可预期的签名行为。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }

      - name: Validate NSIS artifacts and updater metadata
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          $installers = @(Get-ChildItem -Path $releaseDir -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw "NSIS installer is missing under release/" }
          $latestYmlPath = Join-Path $releaseDir "latest.yml"
          if (-not (Test-Path -LiteralPath $latestYmlPath -PathType Leaf)) {
            throw "release/latest.yml is missing"
          }
          $blockmaps = @(Get-ChildItem -Path $releaseDir -Filter '*.blockmap' -File -ErrorAction SilentlyContinue)
          if ($blockmaps.Count -eq 0) { throw "release/*.blockmap is missing" }

          $packageVersion = (Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json).version
          $installerName = "wecom-issue-radar-$packageVersion-setup.exe"
          if (-not (Test-Path -LiteralPath (Join-Path $releaseDir $installerName) -PathType Leaf)) {
            throw "Expected installer is missing: $installerName"
          }

          $manifestText = Get-Content -Raw -Encoding utf8 $latestYmlPath
          $versionMatch = [regex]::Match($manifestText, '(?m)^version:\s*(.+?)\s*$')
          if (-not $versionMatch.Success) { throw "latest.yml does not declare version" }
          $manifestVersion = $versionMatch.Groups[1].Value.Trim('"', "'")
          if ($manifestVersion -ne $packageVersion) {
            throw "latest.yml version $manifestVersion does not match package.json $packageVersion"
          }

          $pathMatch = [regex]::Match($manifestText, '(?m)^path:\s*(.+?)\s*$')
          if (-not $pathMatch.Success) { throw "latest.yml does not declare path" }
          $installerPath = $pathMatch.Groups[1].Value.Trim('"', "'")
          if (-not $installerPath.EndsWith('.exe', [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "latest.yml path is not an .exe: $installerPath"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $releaseDir $installerPath) -PathType Leaf)) {
            throw "latest.yml path does not exist under release/: $installerPath"
          }

          $shaMatch = [regex]::Match($manifestText, '(?m)^sha512:\s*(.+?)\s*$')
          if (-not $shaMatch.Success -or [string]::IsNullOrWhiteSpace($shaMatch.Groups[1].Value)) {
            throw "latest.yml sha512 is empty"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $releaseDir "$installerPath.blockmap") -PathType Leaf)) {
            throw "Blockmap for $installerPath is missing"
          }
          Write-Host "Artifacts OK: $installerName, latest.yml ($manifestVersion), blockmap"

      - name: Validate packaged native helpers
        shell: pwsh
        run: |
          $resourcesBin = Join-Path $env:GITHUB_WORKSPACE "release\win-unpacked\resources\bin"
          if (-not (Test-Path -LiteralPath $resourcesBin -PathType Container)) {
            throw "electron-builder output is missing: release/win-unpacked/resources/bin"
          }
          $requiredBinaries = @(
            "wecom-issue-radar-worker.exe",
            "wechat-input-helper.exe"
          )
          foreach ($name in $requiredBinaries) {
            $path = Join-Path $resourcesBin $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Packaged native binary is missing: resources/bin/$name (check electron-builder.yml extraResources)"
            }
          }
          Write-Host "Packaged native binaries verified: $($requiredBinaries -join ', ')"

      - name: Upload Windows artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: wecom-issue-radar-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

      # ---------------------------------------------------------------------
      # tag 发布：草稿 Release → 兼容 latest.json → 发布 → 公开校验
      # ---------------------------------------------------------------------
      - name: Require a public update source
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $visibility = gh api "repos/$env:GITHUB_REPOSITORY" --jq .visibility
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($visibility)) {
            throw "Cannot read repository visibility"
          }
          if ($visibility.Trim() -ne "public") {
            throw "The in-app updater needs a public repository (visibility: $($visibility.Trim())). Make it public or move latest.yml to a public CDN."
          }
          Write-Host "Repository visibility OK: public"

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

      - name: Generate legacy Tauri updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/make-legacy-updater-manifest.mjs --output release/latest.json
          if ($LASTEXITCODE -ne 0) { throw "Legacy Tauri updater manifest generation failed" }
          $legacyManifest = Get-Content -Raw -Encoding utf8 release/latest.json | ConvertFrom-Json
          if ($legacyManifest.version -ne $env:LEGACY_TAURI_TAG.Substring(1)) {
            throw "Legacy Tauri updater manifest has unexpected version: $($legacyManifest.version)"
          }
          Write-Host "Legacy Tauri updater manifest ready for $env:LEGACY_TAURI_TAG"

      - name: Upload legacy updater manifest to draft Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload $env:RELEASE_TAG "release/latest.json" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Uploading legacy updater manifest failed" }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Publishing the GitHub Release failed" }

      - name: Verify published updater manifests
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $expectedVersion = $env:RELEASE_TAG.Substring(1)
          $legacyVersion = $env:LEGACY_TAURI_TAG.Substring(1)
          $repository = $env:GITHUB_REPOSITORY
          $repositoryUrl = "https://github.com/$repository"
          $latestYmlUrl = "$repositoryUrl/releases/latest/download/latest.yml"
          $latestJsonUrl = "$repositoryUrl/releases/latest/download/latest.json"
          $workDir = Join-Path $env:RUNNER_TEMP "updater-verification"
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          $ymlPath = Join-Path $workDir "latest.yml"
          $jsonPath = Join-Path $workDir "latest.json"
          $verified = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            & curl.exe --fail --silent --show-error --location --output $ymlPath $latestYmlUrl
            $ymlExit = $LASTEXITCODE
            & curl.exe --fail --silent --show-error --location --output $jsonPath $latestJsonUrl
            $jsonExit = $LASTEXITCODE
            if ($ymlExit -eq 0 -and $jsonExit -eq 0) {
              try {
                $manifestText = Get-Content -Raw -Encoding utf8 $ymlPath
                $versionMatch = [regex]::Match($manifestText, '(?m)^version:\s*(.+?)\s*$')
                if (-not $versionMatch.Success) { throw "published latest.yml does not declare version" }
                if ($versionMatch.Groups[1].Value.Trim('"', "'") -ne $expectedVersion) {
                  throw "published latest.yml version does not match $expectedVersion"
                }
                $shaMatch = [regex]::Match($manifestText, '(?m)^sha512:\s*(.+?)\s*$')
                if (-not $shaMatch.Success -or [string]::IsNullOrWhiteSpace($shaMatch.Groups[1].Value)) {
                  throw "published latest.yml sha512 is empty"
                }
                $pathMatch = [regex]::Match($manifestText, '(?m)^path:\s*(.+?)\s*$')
                if (-not $pathMatch.Success) { throw "published latest.yml does not declare path" }
                $installerPath = $pathMatch.Groups[1].Value.Trim('"', "'")
                if (-not $installerPath.EndsWith('.exe', [System.StringComparison]::OrdinalIgnoreCase)) {
                  throw "published latest.yml path is not an .exe: $installerPath"
                }

                $legacy = Get-Content -Raw -Encoding utf8 $jsonPath | ConvertFrom-Json
                if ($legacy.version -ne $legacyVersion) {
                  throw "compat latest.json version $($legacy.version) does not match $legacyVersion"
                }
                $legacyInstallerUrl = $null
                foreach ($platform in @('windows-x86_64', 'windows-x86_64-nsis')) {
                  $entry = $legacy.platforms.$platform
                  if ($null -eq $entry) { throw "compat latest.json is missing platform $platform" }
                  if ([string]::IsNullOrWhiteSpace([string]$entry.signature)) {
                    throw "compat latest.json signature is empty for $platform"
                  }
                  $expectedPrefix = "$repositoryUrl/releases/download/$($env:LEGACY_TAURI_TAG)/"
                  if (-not ([string]$entry.url).StartsWith($expectedPrefix, [System.StringComparison]::Ordinal)) {
                    throw "compat latest.json url is unexpected: $($entry.url)"
                  }
                  if ($null -eq $legacyInstallerUrl) { $legacyInstallerUrl = [string]$entry.url }
                }

                $headFile = Join-Path $workDir "installer-head.bin"
                $installerUrl = "$repositoryUrl/releases/download/$($env:RELEASE_TAG)/$installerPath"
                & curl.exe --fail --silent --show-error --location --range 0-0 --output $headFile $installerUrl
                if ($LASTEXITCODE -ne 0) { throw "installer is not downloadable yet: $installerUrl" }
                & curl.exe --fail --silent --show-error --location --range 0-0 --output $headFile $legacyInstallerUrl
                if ($LASTEXITCODE -ne 0) { throw "legacy installer is not downloadable yet: $legacyInstallerUrl" }

                $verified = $true
                break
              } catch {
                if ($attempt -eq 30) { throw }
                Write-Host "Verification attempt $attempt failed: $($_.Exception.Message)"
              }
            } elseif ($attempt -eq 30) {
              throw "Published updater manifests are not reachable yet (latest.yml exit $ymlExit, latest.json exit $jsonExit)"
            } else {
              Write-Host "Published updater manifests are not available yet (attempt $attempt)"
            }
            Start-Sleep -Seconds 3
          }
          if (-not $verified) { throw "Published updater manifest verification failed" }
          Write-Host "Published latest.yml ($expectedVersion) and compat latest.json ($legacyVersion) verified"
