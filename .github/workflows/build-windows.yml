name: Build Windows installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -r requirements.txt pyinstaller

      - name: Test pipeline
        run: python -m unittest discover -s tests -v

      - name: Build Python processing sidecar
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm worker\issue_radar_worker.spec
          & dist\wecom-issue-radar-worker.exe --self-check
          if ($LASTEXITCODE -ne 0) { throw "Sidecar self-check failed" }
          New-Item -ItemType Directory -Force src-tauri\binaries | Out-Null
          Copy-Item dist\wecom-issue-radar-worker.exe src-tauri\binaries\wecom-issue-radar-worker-x86_64-pc-windows-msvc.exe

      - name: Build Tauri application
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: wecom-issue-radar-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
