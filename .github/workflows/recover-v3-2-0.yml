name: Recover v3.2.0 draft release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-v3-2-0.yml"

permissions:
  contents: write

concurrency:
  group: recover-v3.2.0
  cancel-in-progress: false

jobs:
  recover:
    name: Complete existing v3.2.0 draft
    if: github.repository == 'sy118/wecom-issue-radar'
    runs-on: ubuntu-latest
    steps:
      - name: Generate manifest and publish the verified draft
        uses: actions/github-script@v8
        env:
          EXPECTED_COMMIT: 68d8d6136bc89eddd8d7f8c125bd8c2d535a60c4
          RELEASE_ID: "359181911"
          RELEASE_TAG: v3.2.0
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            const expectedCommit = process.env.EXPECTED_COMMIT;
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;

            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              throw new Error(`Invalid Release ID: ${process.env.RELEASE_ID}`);
            }
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error(`Invalid release tag: ${tag}`);
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const matchingReleases = releases.filter((candidate) => candidate.tag_name === tag);
            if (matchingReleases.length !== 1 || matchingReleases[0].id !== releaseId) {
              throw new Error(
                `Expected Release ${releaseId} to be the only ${tag} Release; found ${matchingReleases.map((candidate) => candidate.id).join(", ") || "none"}`,
              );
            }

            const { data: release } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId,
            });
            if (release.tag_name !== tag) {
              throw new Error(`Release ${releaseId} belongs to ${release.tag_name}, expected ${tag}`);
            }

            const resolveTagTarget = async () => {
              const { data: tagRef } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              let target = tagRef.object;
              for (let depth = 0; target.type === "tag" && depth < 4; depth += 1) {
                const { data: annotatedTag } = await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: target.sha,
                });
                target = annotatedTag.object;
              }
              return target;
            };
            const requireExpectedTagTarget = async () => {
              const target = await resolveTagTarget();
              if (target.type !== "commit" || target.sha !== expectedCommit) {
                throw new Error(
                  `Tag ${tag} resolves to ${target.type}:${target.sha}, expected commit ${expectedCommit}`,
                );
              }
            };
            await requireExpectedTagTarget();

            const exactlyOne = (description, predicate) => {
              const matches = release.assets.filter(predicate);
              if (matches.length !== 1) {
                throw new Error(`Expected one ${description}, found ${matches.length}`);
              }
              return matches[0];
            };
            const nsis = exactlyOne("NSIS installer", (asset) => asset.name.endsWith(".exe"));
            const msi = exactlyOne("MSI installer", (asset) => asset.name.endsWith(".msi"));
            const nsisSignature = exactlyOne(
              "NSIS signature",
              (asset) => asset.name === `${nsis.name}.sig`,
            );
            const msiSignature = exactlyOne(
              "MSI signature",
              (asset) => asset.name === `${msi.name}.sig`,
            );
            for (const asset of [nsis, msi, nsisSignature, msiSignature]) {
              if (asset.state !== "uploaded" || asset.size <= 0) {
                throw new Error(
                  `Release asset is not ready: ${asset.name} (${asset.state}, ${asset.size} bytes)`,
                );
              }
            }
            if (!release.draft) {
              const publishedManifest = exactlyOne(
                "published latest.json",
                (asset) => asset.name === "latest.json",
              );
              if (publishedManifest.state !== "uploaded" || publishedManifest.size <= 0) {
                throw new Error("Published latest.json is not ready");
              }
              core.info(`Release ${releaseId} is already published; continuing with public verification`);
              return;
            }

            const readAsset = async (asset) => {
              const response = await github.request(
                "GET /repos/{owner}/{repo}/releases/assets/{asset_id}",
                {
                  owner,
                  repo,
                  asset_id: asset.id,
                  headers: { accept: "application/octet-stream" },
                },
              );
              const data = Buffer.from(response.data);
              if (data.length !== asset.size) {
                throw new Error(
                  `Downloaded ${asset.name} has ${data.length} bytes, expected ${asset.size}`,
                );
              }
              return data;
            };
            const readSignature = async (asset) => {
              const signature = (await readAsset(asset)).toString("utf8").trim();
              if (!signature) {
                throw new Error(`Updater signature is empty: ${asset.name}`);
              }
              return signature;
            };
            const entryFor = async (installer, signatureAsset) => {
              const url = `https://github.com/${owner}/${repo}/releases/download/${encodeURIComponent(tag)}/${encodeURIComponent(installer.name)}`;
              return {
                signature: await readSignature(signatureAsset),
                url,
              };
            };

            const nsisEntry = await entryFor(nsis, nsisSignature);
            const manifest = {
              version: tag.replace(/^v/, ""),
              notes: release.body || "",
              pub_date: release.created_at || new Date().toISOString(),
              platforms: {
                "windows-x86_64": nsisEntry,
                "windows-x86_64-nsis": nsisEntry,
                "windows-x86_64-msi": await entryFor(msi, msiSignature),
              },
            };
            const manifestData = Buffer.from(`${JSON.stringify(manifest, null, 2)}\n`);

            const oldManifests = release.assets.filter((asset) => asset.name === "latest.json");
            if (oldManifests.length > 1) {
              throw new Error(`Expected at most one existing latest.json, found ${oldManifests.length}`);
            }
            if (oldManifests.length === 1) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: oldManifests[0].id,
              });
            }
            const { data: uploadedManifest } = await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: "latest.json",
              headers: {
                "content-length": manifestData.length,
                "content-type": "application/json",
              },
              data: manifestData,
            });
            if (
              uploadedManifest.name !== "latest.json" ||
              uploadedManifest.state !== "uploaded" ||
              uploadedManifest.size !== manifestData.length
            ) {
              throw new Error("latest.json upload could not be verified");
            }
            const uploadedManifestData = await readAsset(uploadedManifest);
            if (!uploadedManifestData.equals(manifestData)) {
              throw new Error("Uploaded latest.json differs from the generated manifest");
            }

            const { data: readyRelease } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId,
            });
            if (!readyRelease.draft || readyRelease.tag_name !== tag) {
              throw new Error("Draft Release changed while its updater manifest was prepared");
            }
            await requireExpectedTagTarget();
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              make_latest: "true",
            });

      - name: Verify the anonymous updater endpoint
        shell: bash
        env:
          RELEASE_TAG: v3.2.0
        run: |
          manifest_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          for attempt in $(seq 1 30); do
            rm -f latest.json installer-urls.txt
            if curl --fail --location --output latest.json "$manifest_url" && python - "$RELEASE_TAG" <<'PY'
          import json
          import os
          import sys

          tag = sys.argv[1]
          expected = tag.removeprefix("v")
          expected_url_prefix = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          )
          with open("latest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          assert manifest["version"] == expected, manifest
          platforms = manifest["platforms"]
          urls = set()
          for platform in ("windows-x86_64", "windows-x86_64-nsis", "windows-x86_64-msi"):
              entry = platforms[platform]
              assert entry["signature"].strip(), manifest
              assert entry["url"].startswith(expected_url_prefix), manifest
              urls.add(entry["url"])
          with open("installer-urls.txt", "w", encoding="utf-8") as handle:
              handle.write("\n".join(sorted(urls)) + "\n")
          PY
            then
              break
            fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 3
          done
          while IFS= read -r installer_url; do
            curl --fail --location --retry 5 --retry-all-errors --range 0-0 --output /dev/null "$installer_url"
          done < installer-urls.txt
