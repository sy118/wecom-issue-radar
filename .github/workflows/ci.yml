name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR / main 的快速门禁：前端单测与类型检查、Electron main/preload 打包、
# Python 测试与 PyInstaller sidecar 自检。正式安装包只在 build-windows.yml 里构建。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Electron, frontend and Python
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # M2 引入 Rust `wechat-input-helper.exe` 后，在此增加 Rust 工具链与静态检查；
      # M0 的 Electron 外壳不依赖 Rust。
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "pyinstaller==6.21.0"

      - name: Test frontend
        run: pnpm test

      - name: Type-check frontend and Electron sources
        run: pnpm typecheck

      - name: Build renderer
        run: pnpm build:renderer

      - name: Build Electron main and preload bundles
        run: pnpm build:electron

      - name: Verify build outputs
        shell: pwsh
        run: |
          $required = @(
            "frontend-dist\index.html",
            "dist-electron\main.cjs",
            "dist-electron\preload.cjs"
          )
          foreach ($relative in $required) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Build output is missing: $relative"
            }
          }
          Write-Host "Renderer, main and preload bundles are present"

      - name: Test Python pipeline
        run: python -m unittest discover -s tests -v

      - name: Build Python processing sidecar
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm worker\issue_radar_worker.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          $sidecar = Join-Path $env:GITHUB_WORKSPACE "dist\wecom-issue-radar-worker.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Sidecar executable is missing: $sidecar"
          }
          & $sidecar --self-check
          if ($LASTEXITCODE -ne 0) { throw "Sidecar self-check failed" }
          Write-Host "Sidecar self-check passed"
