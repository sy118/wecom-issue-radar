name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR / main 的快速门禁：前端单测与类型检查、Electron main/preload 打包、
# Rust 微信填入 helper（fmt/clippy/test/build）、Python 测试与 PyInstaller sidecar 自检。
# 正式安装包只在 build-windows.yml 里构建。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Electron, frontend and Python
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "pyinstaller==6.21.0"

      - name: Test frontend
        run: pnpm test

      - name: Type-check frontend and Electron sources
        run: pnpm typecheck

      - name: Build renderer
        run: pnpm build:renderer

      - name: Build Electron main and preload bundles
        run: pnpm build:electron

      - name: Format Rust helper
        shell: pwsh
        run: |
          # rustfmt is applied in CI; formatting differences must not block CI.
          cargo fmt --manifest-path native/wechat-input-helper/Cargo.toml
          if ($LASTEXITCODE -ne 0) {
            throw "cargo fmt failed for native/wechat-input-helper"
          }

      - name: Lint Rust helper
        shell: pwsh
        run: |
          cargo clippy --manifest-path native/wechat-input-helper/Cargo.toml --target x86_64-pc-windows-msvc --all-targets
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed for native/wechat-input-helper" }

      - name: Test Rust helper
        shell: pwsh
        run: |
          cargo test --manifest-path native/wechat-input-helper/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed for native/wechat-input-helper" }

      - name: Build Rust WeChat fill helper
        shell: pwsh
        run: |
          cargo build --release --manifest-path native/wechat-input-helper/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed for native/wechat-input-helper" }
          $helper = Join-Path $env:GITHUB_WORKSPACE "native\wechat-input-helper\target\x86_64-pc-windows-msvc\release\wechat-input-helper.exe"
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "Rust helper executable is missing: $helper"
          }
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item -LiteralPath $helper -Destination (Join-Path $distDir "wechat-input-helper.exe") -Force
          Write-Host "Rust helper copied to dist/wechat-input-helper.exe"

      - name: Build Python processing sidecar
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm worker\issue_radar_worker.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          $sidecar = Join-Path $env:GITHUB_WORKSPACE "dist\wecom-issue-radar-worker.exe"
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) {
            throw "Sidecar executable is missing: $sidecar"
          }
          & $sidecar --self-check
          if ($LASTEXITCODE -ne 0) { throw "Sidecar self-check failed" }
          Write-Host "Sidecar self-check passed"

      - name: Verify build outputs
        shell: pwsh
        run: |
          $required = @(
            "frontend-dist\index.html",
            "dist-electron\main.cjs",
            "dist-electron\preload.cjs",
            "dist\wecom-issue-radar-worker.exe",
            "dist\wechat-input-helper.exe"
          )
          foreach ($relative in $required) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Build output is missing: $relative"
            }
          }
          Write-Host "Renderer, Electron bundles, Python sidecar and Rust helper are present"

      - name: Test Python pipeline
        run: python -m unittest discover -s tests -v
