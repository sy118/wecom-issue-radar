appId: com.sy118.wecom-issue-radar
productName: 企微问题雷达
copyright: Copyright © 2026 sy118

directories:
  output: release
  buildResources: build

# Renderer bundles come from Vite (frontend-dist), the Electron main/preload
# bundles from esbuild (dist-electron). The Python sidecar and the Rust WeChat
# fill helper are shipped through extraResources so they live outside the asar
# archive and are spawned directly from resources/bin.
files:
  - dist-electron/**/*
  - frontend-dist/**/*
  - package.json

extraResources:
  - from: dist/wecom-issue-radar-worker.exe
    to: bin/wecom-issue-radar-worker.exe
  - from: dist/wechat-input-helper.exe
    to: bin/wechat-input-helper.exe

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "wecom-issue-radar-${version}-setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: 企微问题雷达

publish:
  provider: github
  owner: sy118
  repo: wecom-issue-radar
  releaseType: release
