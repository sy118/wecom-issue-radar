schema: spec-driven

# 项目上下文（可选）
# 只添加应当约束 OpenSpec 产出物和工作流的要求。
# 包含 AI 无法通过阅读代码推断出的约束。
# 不要放通用的项目文档和可从代码中发现的事实。
# 示例：
#   context: |
#     设计和任务必须覆盖 Windows、macOS 和 Linux
#     所有产出物使用中文撰写

# 按产出物的规则（可选）
# 为特定产出物添加自定义规则。
# 示例：
#   rules:
#     proposal:
#       - 提案保持在 500 字以内
#       - 始终说明范围之外的内容
#     tasks:
#       - 将任务拆分为每次不超过 2 小时的工作块

# 按操作的指南（可选）
# 为 apply 和 archive 操作添加咨询性指南。
# 此段落独立于上述的产出物规则。
# 示例：
#   operations:
#     apply:
#       guidance:
#         - 测试摘要保持简洁
#     archive:
#       guidance:
#         - 完成前总结归档结果
